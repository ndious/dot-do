[package]
name = "dot-do"
version = "0.1.0"
edition = "2021"
description = "A git-native todo CLI: one branch, one context, one file per task"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
